name: Verilog Lint & Syntax Check

on:
  push:
    branches: [ "main", "qpsk", "**" ]
  pull_request:
    branches: [ "main", "qpsk" ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      # -g2012 is required: src/zc_seq.v has unpacked-array ports and the
      # new modules use $clog2. -I src is required so the bare
      # `include "FFT64.v" &c. inside src/ifft_64.v resolve.
      # full.v lives at the repo root, so it is listed explicitly; every RTL
      # file is include-guarded, so listing src/*.v alongside it is safe.
      - name: Compile and Syntax Check All Modules Together
        run: |
          iverilog -g2012 -Wall -t null -I src full.v src/*.v testbenches/*.v

      # Timescale-inheritance warnings are expected and non-fatal: several RTL
      # files predate this repo and carry no `timescale directive.
      - name: Elaborate every testbench
        run: |
          set -e
          iverilog -g2012 -I src -o /tmp/t.vvp src/zc_seq.v            testbenches/tb_zc_seq.v       && vvp /tmp/t.vvp | grep -q "exited with  0 errors"
          iverilog -g2012 -I src -o /tmp/t.vvp src/qpsk.v              testbenches/tb_qpsk.v
          iverilog -g2012 -I src -o /tmp/t.vvp src/qpsk_signal.v src/qpsk_signal_128.v testbenches/tb_QPSK_signal.v
          iverilog -g2012 -I src -o /tmp/t.vvp src/map_to_subcarriers.v testbenches/tb_subcarrier.v   && vvp /tmp/t.vvp | grep -q "0 ERROR(S)"
          iverilog -g2012 -I src -o /tmp/t.vvp src/add_cp.v            testbenches/tb_add_cp.v      && vvp /tmp/t.vvp | grep -q "ALL TESTS PASSED"
          iverilog -g2012 -I src -o /tmp/t.vvp src/ifft_64.v           testbenches/tb_ifft_64.v     && vvp /tmp/t.vvp | grep -q "ALL IFFT TESTS PASSED"
          iverilog -g2012 -I src -o /tmp/t.vvp full.v                  testbenches/tb_ofdm_frame.v  && vvp /tmp/t.vvp | grep -q "ALL OFDM FRAME TESTS PASSED"